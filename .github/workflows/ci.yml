name: CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download and install YashanDB JDBC driver
        run: |
          curl -fsSL https://linked.yashandb.com/upload1010/yashandb-jdbc-1.9.3.jar \
            -o yashandb-jdbc.jar
          mvn install:install-file \
            -Dfile=yashandb-jdbc.jar \
            -DgroupId=com.yashandb \
            -DartifactId=yashandb-jdbc \
            -Dversion=1.9.3 \
            -Dpackaging=jar \
            -q

      - name: Start YashanDB
        run: |
          docker pull yasdb/yashandb:23.4.7.100
          docker run -d -p 1688:1688 -e SYS_PASSWD=Enmo_123 --name yashandb yasdb/yashandb:23.4.7.100

      - name: Wait for YashanDB to be ready
        run: |
          echo "Waiting for YashanDB to be ready..."
          for i in $(seq 1 30); do
            if nc -z localhost 1688 2>/dev/null; then
              echo "YashanDB is ready after $((i * 10)) seconds."
              break
            fi
            echo "  attempt $i/30 — not ready yet, waiting 10s..."
            sleep 10
          done
          nc -z localhost 1688 || { echo "YashanDB did not start in time"; exit 1; }

      - name: Run all tests
        run: |
          mvn -B test \
            -Ddb.password=Enmo_123 \
            --no-transfer-progress
