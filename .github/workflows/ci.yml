name: CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install YashanDB JDBC driver
        env:
          YASHANDB_JDBC_JAR_BASE64: ${{ secrets.YASHANDB_JDBC_JAR_BASE64 }}
        run: |
          echo "$YASHANDB_JDBC_JAR_BASE64" | base64 -d > yashandb-jdbc.jar
          mvn install:install-file \
            -Dfile=yashandb-jdbc.jar \
            -DgroupId=com.yashandb \
            -DartifactId=yashandb-jdbc \
            -Dversion=1.10.2 \
            -Dpackaging=jar \
            -q

      - name: Run unit tests
        run: |
          mvn -B test \
            -Dtest='!IntegrationTest' \
            --no-transfer-progress
