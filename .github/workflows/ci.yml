name: CI

on:
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Resolve Maven dependencies
        run: mvn -B dependency:resolve -q --no-transfer-progress

      - name: Start YashanDB
        run: |
          docker pull yasdb/yashandb:23.4.7.100
          docker run -d -p 1688:1688 -e SYS_PASSWD=Enmo_123 --name yashandb yasdb/yashandb:23.4.7.100

      - name: Wait for YashanDB to be ready
        run: |
          JDBC_VERSION=$(mvn help:evaluate -Dexpression=yashandb-jdbc.version -q -DforceStdout --no-transfer-progress)
          JDBC_JAR=$HOME/.m2/repository/com/yashandb/yashandb-jdbc/$JDBC_VERSION/yashandb-jdbc-$JDBC_VERSION.jar
          # Phase 1: wait for the TCP port to open
          echo "Waiting for YashanDB port 1688 to open..."
          for i in $(seq 1 30); do
            if nc -z localhost 1688 2>/dev/null; then
              echo "Port 1688 is open after $(((i - 1) * 10)) seconds."
              break
            fi
            echo "  attempt $i/30 — port not open yet, waiting 10s..."
            sleep 10
          done
          nc -z localhost 1688 || { echo "YashanDB did not bind to port in time"; exit 1; }

          # Phase 2: probe with a real JDBC connection (port open != DB ready)
          cat > /tmp/YashanProbe.java << 'JAVA'
          import java.sql.*;
          public class YashanProbe {
              public static void main(String[] args) throws Exception {
                  DriverManager.setLoginTimeout(5);
                  try (Connection c = DriverManager.getConnection(
                          "jdbc:yasdb://localhost:1688/", "sys", "Enmo_123")) {
                      System.out.println("JDBC connection successful.");
                  }
              }
          }
          JAVA
          javac -cp "$JDBC_JAR" /tmp/YashanProbe.java -d /tmp/
          echo "Probing JDBC connection..."
          for i in $(seq 1 30); do
            if java -cp "$JDBC_JAR:/tmp" YashanProbe 2>/dev/null; then
              echo "YashanDB JDBC is ready after $(((i - 1) * 10)) extra seconds."
              break
            fi
            echo "  JDBC attempt $i/30 — DB not accepting connections yet, waiting 10s..."
            sleep 10
          done
          java -cp "$JDBC_JAR:/tmp" YashanProbe \
            || { echo "YashanDB is not accepting JDBC connections after 5 minutes"; exit 1; }

      - name: Run all tests
        run: |
          mvn -B test \
            -Ddb.password=Enmo_123 \
            --no-transfer-progress
