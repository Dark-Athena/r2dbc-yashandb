name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install YashanDB JDBC driver
        env:
          YASHANDB_JDBC_JAR_BASE64: ${{ secrets.YASHANDB_JDBC_JAR_BASE64 }}
        run: |
          echo "$YASHANDB_JDBC_JAR_BASE64" | base64 -d > yashandb-jdbc.jar
          mvn install:install-file \
            -Dfile=yashandb-jdbc.jar \
            -DgroupId=com.yashandb \
            -DartifactId=yashandb-jdbc \
            -Dversion=1.10.2 \
            -Dpackaging=jar \
            -q

      - name: Set version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mvn -B versions:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DgenerateBackupPoms=false \
            --no-transfer-progress

      - name: Build and package
        run: |
          mvn -B package \
            -DskipTests \
            --no-transfer-progress

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          prerelease: false
          files: |
            target/r2dbc-yashandb-${{ inputs.version }}.jar
            target/r2dbc-yashandb-${{ inputs.version }}-sources.jar
